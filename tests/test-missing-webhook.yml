name: Test missing webhook URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without SLACK_WEBHOOK_URL (should fail)
        id: action
        uses: .
        with:
          status: failure
          notify_when: "failure"
          notification_title: "Test Notification"
        continue-on-error: true
        # SLACK_WEBHOOK_URL is intentionally not set

      - name: Assert action failed due to missing webhook URL
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when SLACK_WEBHOOK_URL is missing, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when SLACK_WEBHOOK_URL was not provided"
