name: Test failure when SLACK_WEBHOOK_URL is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          status: failure
          notify_when: "success,failure,cancelled,warnings,skipped"
          # No SLACK_WEBHOOK_URL set — action should throw and call setFailed
      - name: Assert action failed due to missing webhook URL
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when SLACK_WEBHOOK_URL is missing, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when SLACK_WEBHOOK_URL is not set"
