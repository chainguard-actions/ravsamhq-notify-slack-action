name: Test skip notification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with status not in notify_when (should skip silently)
        id: action
        uses: .
        with:
          status: success
          notify_when: "failure,cancelled"
          notification_title: "Test Notification"
        # No SLACK_WEBHOOK_URL set — action should exit early before reaching webhook call

      - name: Assert action completed without failure
        run: |
          echo "Action completed successfully (notification was skipped as expected)"
          echo "PASS"
