name: Test basic success notification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start fake Slack webhook server
        run: |
          # Start a simple HTTP server that accepts POST requests
          python3 -c "
          import http.server, threading, json, sys

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  with open('/tmp/slack_payload.json', 'wb') as f:
                      f.write(body)
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b'ok')
              def log_message(self, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 9999), Handler)
          t = threading.Thread(target=server.serve_forever)
          t.daemon = True
          t.start()
          import time; time.sleep(30)
          " &
          sleep 1
          echo "Fake Slack server started"

      - id: action
        uses: .
        env:
          SLACK_WEBHOOK_URL: http://127.0.0.1:9999/webhook
        with:
          status: success
          notification_title: "Test Notification"
          notify_when: "success,failure,cancelled,warnings,skipped"

      - name: Wait for async fetch to complete
        run: sleep 2

      - name: Assert payload was received
        run: |
          if [ ! -f /tmp/slack_payload.json ]; then
            echo "FAIL: No payload received by fake Slack server"
            exit 1
          fi
          PAYLOAD=$(cat /tmp/slack_payload.json)
          echo "Received payload: $PAYLOAD"
          # Check that the payload contains attachments
          if ! echo "$PAYLOAD" | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'attachments' in d, 'no attachments'"; then
            echo "FAIL: Payload missing attachments"
            exit 1
          fi
          # Check that the color is 'good' for success
          if ! echo "$PAYLOAD" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['attachments'][0]['color'] == 'good', f'wrong color: {d[\"attachments\"][0][\"color\"]}'"; then
            echo "FAIL: Expected color 'good' for success status"
            exit 1
          fi
          echo "PASS: Payload received with correct structure"
