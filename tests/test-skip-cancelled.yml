name: Test skip notification for cancelled status
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When status=cancelled but notify_when only includes success and failure,
      # the action should skip sending a notification and exit successfully
      - id: action
        uses: .
        with:
          status: "cancelled"
          notify_when: "success,failure"

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully - cancelled notification was skipped as expected"
          echo "PASS"
