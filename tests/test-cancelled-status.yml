name: Test cancelled status notification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start fake Slack webhook server
        run: |
          python3 -c "
          import http.server, threading

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  with open('/tmp/slack_cancelled_payload.json', 'wb') as f:
                      f.write(body)
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b'ok')
              def log_message(self, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 9996), Handler)
          t = threading.Thread(target=server.serve_forever)
          t.daemon = True
          t.start()
          import time; time.sleep(30)
          " &
          sleep 1
          echo "Fake Slack server started on port 9996"

      - id: action
        uses: .
        env:
          SLACK_WEBHOOK_URL: http://127.0.0.1:9996/webhook
        with:
          status: cancelled
          notification_title: "Job Cancelled"
          notify_when: "cancelled"

      - name: Wait for async fetch to complete
        run: sleep 2

      - name: Assert cancelled payload received with correct color
        run: |
          if [ ! -f /tmp/slack_cancelled_payload.json ]; then
            echo "FAIL: No payload received by fake Slack server"
            exit 1
          fi
          PAYLOAD=$(cat /tmp/slack_cancelled_payload.json)
          echo "Received payload: $PAYLOAD"
          # Check color is 'danger' for cancelled (same as failure per source)
          if ! echo "$PAYLOAD" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['attachments'][0]['color'] == 'danger', f'wrong color: {d[\"attachments\"][0][\"color\"]}'"; then
            echo "FAIL: Expected color 'danger' for cancelled status"
            exit 1
          fi
          # Check the text contains 'cancelled' status message
          if ! echo "$PAYLOAD" | python3 -c "import sys,json; d=json.load(sys.stdin); text=d['attachments'][0]['text']; assert 'cancelled' in text, f'status_message not found in text: {text}'"; then
            echo "FAIL: Expected 'cancelled' in message text"
            exit 1
          fi
          echo "PASS: Cancelled payload received with correct color 'danger'"
